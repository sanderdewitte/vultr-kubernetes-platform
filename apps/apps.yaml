authentik:
  namespace: true
  database:
    enabled: true
  chart:
    repository_url: https://charts.goauthentik.io
    version: 2026.5.3
  default_host_prefix: auth
  secret_requirements:
    - postgresql_password
    - secret_key
  helm_parameter_paths:
    database_name: authentik.postgresql.name
    database_user: authentik.postgresql.user
    ingress_host: server.ingress.hosts[?]
    ingress_tls_secret: server.ingress.tls[?].secretName
    ingress_tls_host: server.ingress.tls[?].hosts[?]

homarr:
  namespace: true
  database:
    enabled: true
    connection_url_secret: true
  authentication:
    oidc:
      secret_requirements:
        - client_id
        - client_secret
      helm_parameter_paths:
        providers: env.AUTH_PROVIDERS
        issuer: env.AUTH_OIDC_ISSUER
        client_name: env.AUTH_OIDC_CLIENT_NAME
        scope: env.AUTH_OIDC_SCOPE_OVERWRITE
        groups_attribute: env.AUTH_OIDC_GROUPS_ATTRIBUTE
        logout_redirect_url: env.AUTH_LOGOUT_REDIRECT_URL
  chart:
    repository_url: https://homarr-labs.github.io/charts/
    version: 8.25.0
  default_host_prefix: www
  secret_requirements:
    - postgresql_password
    - secret_encryption_key
  helm_parameter_paths:
    ingress_host: ingress.hosts[?].host
    ingress_tls_secret: ingress.tls[?].secretName
    ingress_tls_host: ingress.tls[?].hosts[?]
