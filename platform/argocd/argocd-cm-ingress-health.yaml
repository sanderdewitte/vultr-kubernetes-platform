apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  resource.customizations.health.networking.k8s.io_Ingress: |-
    hs = {}
    if obj.spec ~= nil and obj.spec.ingressClassName == "traefik" then
      hs.status = "Healthy"
      hs.message = "Traefik hostPort ingress is considered healthy without loadBalancer status"
      return hs
    end
    if obj.status ~= nil and obj.status.loadBalancer ~= nil and obj.status.loadBalancer.ingress ~= nil and #obj.status.loadBalancer.ingress > 0 then
      hs.status = "Healthy"
      hs.message = "Ingress has loadBalancer status"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for ingress loadBalancer status"
    return hs