apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.8

    helm:
      values: |
        deployment:
          kind: Deployment
          replicas: 1

        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet

        service:
          enabled: false

        ports:
          web:
            port: 80
            hostPort: 80
            expose:
              default: false
          websecure:
            port: 443
            hostPort: 443
            expose:
              default: false

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true