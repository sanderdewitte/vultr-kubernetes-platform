apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: welcome
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sanderdewitte/vultr-kubernetes-platform.git
    targetRevision: main
    path: apps/welcome

  destination:
    server: https://kubernetes.default.svc
    namespace: welcome

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true